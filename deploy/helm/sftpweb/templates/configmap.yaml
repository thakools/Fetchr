apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sftpweb.fullname" . }}
  labels:
    {{- include "sftpweb.labels" . | nindent 4 }}
data:
  SFTPWEB_LOG_LEVEL: {{ .Values.app.logLevel | quote }}
  SFTPWEB_SKIP_LOGIN: {{ .Values.app.skipLogin | quote }}
  SFTPWEB_SESSION_TTL: {{ .Values.app.sessionTtl | quote }}
  SFTPWEB_COOKIE_SECURE: {{ .Values.app.cookieSecure | quote }}
  SFTPWEB_MAX_UPLOAD_SIZE: {{ .Values.app.maxUploadSize | quote }}
  SFTPWEB_MAX_CONNECTIONS: {{ .Values.app.maxConnections | quote }}
  SFTPWEB_DIAL_TIMEOUT: {{ .Values.app.dialTimeout | quote }}
  SFTPWEB_INSECURE_HOST_KEY: {{ .Values.app.insecureHostKey | quote }}
  SFTPWEB_ALLOWED_HOSTS: {{ join "," .Values.app.allowedHosts | quote }}
  {{- if not .Values.app.skipLogin }}
  SFTPWEB_OIDC_ISSUER: {{ .Values.oidc.issuer | quote }}
  SFTPWEB_OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  SFTPWEB_OIDC_REDIRECT_URL: {{ .Values.oidc.redirectUrl | quote }}
  SFTPWEB_OIDC_SCOPES: {{ .Values.oidc.scopes | quote }}
  {{- end }}
