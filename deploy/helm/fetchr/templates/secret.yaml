{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fetchr.fullname" . }}
  labels:
    {{- include "fetchr.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  oidc-client-secret: {{ .Values.secret.oidcClientSecret | quote }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "fetchr.fullname" .) }}
  {{- if .Values.secret.sessionSecret }}
  session-secret: {{ .Values.secret.sessionSecret | quote }}
  {{- else if and $existing (index $existing.data "session-secret") }}
  session-secret: {{ index $existing.data "session-secret" | b64dec | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 48 | quote }}
  {{- end }}
{{- end }}
