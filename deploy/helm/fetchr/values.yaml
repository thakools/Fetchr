replicaCount: 1

image:
  repository: thakoolsri/fetchr
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

app:
  logLevel: info
  # Disables Keycloak entirely. Never enable this on a shared cluster.
  skipLogin: false
  sessionTtl: 30m
  cookieSecure: true
  maxUploadSize: 5GiB
  maxConnections: 200
  dialTimeout: 10s
  # Restrict which SFTP hosts users may reach. Empty means any host.
  allowedHosts: []
  # Host key pinning is not implemented yet; see the README.
  insecureHostKey: true

oidc:
  issuer: https://keycloak.example.com/realms/applications
  clientId: fetchr
  # Public URL of the callback endpoint.
  redirectUrl: https://sftp.example.com/api/auth/callback
  scopes: "openid,profile,email"

secret:
  # Reference a pre-existing Secret instead of letting the chart create one.
  # It must contain the keys: oidc-client-secret, session-secret
  existingSecret: ""
  oidcClientSecret: ""
  sessionSecret: ""

service:
  type: ClusterIP
  port: 80
  # SFTP connections are held in process memory, so a client must keep
  # reaching the same pod. Do not disable this with replicaCount > 1.
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 10800

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 5g
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/session-cookie-name: fetchr-route
  hosts:
    - host: sftp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: fetchr-tls
    #   hosts:
    #     - sftp.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

networkPolicy:
  enabled: false
  # Egress rules must allow DNS, the Keycloak issuer and the target SFTP hosts.
  egress: []
